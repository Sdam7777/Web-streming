<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tariaki - Platform Streaming Anime</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="brand-logo" id="logoBtn">
                <div class="logo-icon">
                    <i class="fa-solid fa-play"></i>
                </div>
                <span class="logo-text">TARIAKI</span>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari anime..." oninput="filterCatalog()">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
        <!-- 1. CATALOG DASHBOARD VIEW -->
        <section id="catalogView" class="view-section active">
            <div class="section-header">
                <h2><i class="fa-solid fa-fire text-orange"></i> Katalog Anime</h2>
                <p>Pilih anime favoritmu untuk mulai menonton streaming tanpa buffer.</p>
            </div>

            <div class="anime-grid" id="animeGrid">
                <!-- Anime card generated by app.js -->
            </div>
        </section>

        <!-- 2. ANIME DETAIL & EPISODES VIEW -->
        <section id="detailView" class="view-section hidden">
            <button class="btn-back" onclick="showCatalog()">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Katalog
            </button>

            <!-- Anime Profile Header -->
            <div class="anime-profile-card">
                <div class="poster-container">
                    <img id="animePoster" src="" alt="Anime Poster">
                </div>
                <div class="profile-info">
                    <h1 id="animeTitle" class="anime-title"></h1>
                    <div class="anime-badges">
                        <span class="badge badge-orange" id="animeType">TV Series</span>
                        <span class="badge badge-slate" id="animeStatus">Completed</span>
                        <span class="badge badge-slate" id="animeEpCount">13 Episode</span>
                    </div>
                    <p id="animeSynopsis" class="synopsis"></p>
                </div>
            </div>

            <!-- Episode Grid / List -->
            <div class="episodes-section">
                <h3><i class="fa-solid fa-list-ul text-orange"></i> Daftar Episode</h3>
                <div class="episodes-grid" id="episodesGrid">
                    <!-- Episodes buttons generated by app.js -->
                </div>
            </div>
        </section>

        <!-- 3. PLAYER VIEW -->
        <section id="playerView" class="view-section hidden">
            <button class="btn-back" onclick="showDetail()">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Detail Anime
            </button>

            <div class="player-container">
                <div class="video-wrapper">
                    <video id="videoPlayer" controls preload="metadata">
                        <source id="videoSource" src="" type="video/mp4">
                        Browser Anda tidak mendukung pemutar video HTML5.
                    </video>
                </div>

                <div class="player-meta">
                    <div class="player-title-row">
                        <div>
                            <h2 id="currentEpisodeTitle">Prison School - Episode 01</h2>
                            <div class="player-sub-meta">
                                <span class="meta-tag"><i class="fa-solid fa-hard-drive"></i> <span id="sizeBadge">0 MB</span></span>
                                <span class="meta-tag"><i class="fa-solid fa-eye"></i> <span id="viewCountText">0</span> views</span>
                            </div>
                        </div>
                        <a id="downloadBtn" href="#" class="btn-download" target="_blank" download>
                            <i class="fa-solid fa-download"></i> Unduh MKV
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="brand-logo small">
                <div class="logo-icon small">
                    <i class="fa-solid fa-play"></i>
                </div>
                <span class="logo-text">TARIAKI</span>
            </div>
            <p>&copy; 2026 Tariaki. Fast anime streaming platform.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
