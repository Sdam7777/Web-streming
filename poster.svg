<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect width="300" height="420" fill="url(#bgGrad)" rx="16" />
  <!-- Bars pattern -->
  <g stroke="#27272a" stroke-width="8">
    <line x1="60" y1="0" x2="60" y2="420" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="180" y1="0" x2="180" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
  </g>
  <!-- Glowing Icon -->
  <circle cx="150" cy="180" r="50" fill="url(#accentGrad)" />
  <polygon points="140,160 170,180 140,200" fill="#ffffff" />
  <!-- Anime Title -->
  <text x="150" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">PRISON SCHOOL</text>
  <text x="150" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#f97316" text-anchor="middle">SUBTITLE INDONESIA</text>
  <rect x="100" y="340" width="100" height="26" rx="13" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="1"/>
  <text x="150" y="357" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">12 Ep + OVA</text>
</svg>
